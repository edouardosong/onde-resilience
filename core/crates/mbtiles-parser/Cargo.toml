[package]
name = "mbtiles-parser"
version = "0.1.0"
edition = "2021"
description = "MBTiles 1.3 reader (SQLite tile store) for offline maps"

[dependencies]
# Persistance SQLite embarquee : meme dependance que onde-core (aucune nouvelle
# crate telechargee, aucun C nouveau par rapport a l'existant `bundled`).
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
