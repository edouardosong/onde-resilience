[package]
name = "llama-bind"
version = "0.2.0"
edition = "2021"
description = "llama.cpp GGML/llama bindings for ONDE AI inference"

[lib]
name = "llama_bind"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"

# Real llama.cpp FFI (compiled only when the `llama-cpp` feature is enabled)
llama_cpp_sys = { version = "0.3", optional = true }

[features]
default = ["mock"]
llama-cpp = ["dep:llama_cpp_sys"]  # Enable real llama.cpp FFI (GGUF inference)
mock = []       # Mock inference for testing

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }