[package]
name = "onde-core"
version = "0.2.0"
edition = "2021"
authors = ["ONDE Project"]
description = "Core network engine for ONDE citizen resilience mesh network"
license = "MIT"

[workspace]
members = [
    "crates/llm-inference",
    "crates/dtn-router",
    "crates/whisper-stt",
    "crates/zim-parser",
    "crates/llama-bind",
]
# whisper_cpp_sys is vendored C (whisper.cpp) built via CMake; kept OUT of the
# workspace so default CI builds (`--workspace`) never compile any C code.
# It is pulled in only through the optional `whisper-cpp` feature of
# whisper-stt (same pattern as llama_cpp_sys behind llama-bind's `llama-cpp`).
exclude = ["crates/whisper_cpp_sys"]

[lib]
name = "onde_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "onde_node"
path = "src/bin/node.rs"
doc = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 (demo PNG tile payload)
base64 = "0.22"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
chacha20poly1305 = "0.10"
hex = "0.4"
# ECDH key exchange (X25519) for end-to-end message encryption.
# `zeroize` : les secrets X25519 sont effacés en mémoire à la libération.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# HKDF key derivation (RFC 5869) for the encryption protocol
hkdf = "0.12"
# Zeroization des buffers intermédiaires de dérivation de clé (Audit m6)
zeroize = "1"

# Compression for tiered storage (Audit #8) — pur Rust, déjà dans l'arbre
flate2 = "1.0"

# Persistance SQLite (Audit #14 / plan P0 — résilience aux crashs).
# `bundled` compile SQLite en Rust-free C amalgamation : aucune dépendance
# système, fonctionne sur Android, desktop et dans les tests.
rusqlite = { version = "0.37", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Network
socket2 = "0.5"
bytes = "1"

# AI inference (GGML via C binding wrapper)
# In production: llama-cpp-sys or similar
# For now: mock interface for local inference
llm-inference = { path = "crates/llm-inference" }

# DTN routing
dtn-router = { path = "crates/dtn-router" }

# Speech-to-Text (whisper.cpp)
whisper-stt = { path = "crates/whisper-stt", features = ["mock"] }

# ZIM file parser (offline Wikipedia)
zim-parser = { path = "crates/zim-parser" }

# llama.cpp GGML bindings (AI inference)
llama-bind = { path = "crates/llama-bind", features = ["mock"] }

# Feature flags
[dev-dependencies]
# Isolation des tests (L2-13) : répertoire temporaire UNIQUE par test
# (déjà dans le lockfile via zim-parser — aucune nouvelle crate téléchargée).
tempfile = "3"

[features]
default = ["mobile"]
mobile = []       # Mobile device profile
desktop = ["llm-inference/heavy-models"]  # Desktop oracle profile

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

