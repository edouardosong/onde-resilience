name: CI — Rust / Android / UI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # Qualité hebdomadaire (dépendances / audit)

# Least-privilege : la CI lit le repo ; le write passe par GITHUB_TOKEN explicitement
# sur les jobs de release uniquement, en élargissant le scope au plus fin (contents: write,
# seulement lorsque tag v*).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  #────────────────────────────────────────────────────────────────────────
  # JOB 1 — rust (core/) : fmt + clippy + tests + coverage + build release
  #────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust core (fmt · clippy · test · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain (fmt + clippy)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Gates de qualité rust ──────────────────────────────────────────
      - name: Gate — cargo fmt (check)
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Gate — cargo clippy (-D warnings)
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Gate — unit + doc tests
        working-directory: core
        run: cargo test --workspace

      - name: Gate — integration e2e
        working-directory: core
        run: cargo test --test integration_e2e

      # ── Coverage (codecov) ─────────────────────────────────────────────
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        working-directory: core
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@eaaf4bedf32dbdc6b720b63067d99c4d77d6047d # v5
        with:
          files: core/lcov.info
          fail_ci_if_error: false
          verbose: true

      # ── Release (tag v*) ──────────────────────────────────────────────
      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: core
        run: cargo build --release --workspace

      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: onde-core-release
          path: |
            core/target/release/onde_node
            core/target/release/*.so
            core/target/release/*.dylib
          if-no-files-found: ignore

  #────────────────────────────────────────────────────────────────────────
  # JOB 2 — android : librust core NDK + gradle build + lint + APK release
  #────────────────────────────────────────────────────────────────────────
  android:
    name: Android (NDK core · gradle build · lint · APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (API 34 + NDK 26.2.11394342)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          api-level: 34
          ndk-version: "26.2.11394342"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo (NDK)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Cache gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Wrapper gradle commité (gradlew + jar) : pas de génération en CI.

      - name: Build Rust core for Android (NDK)
        working-directory: core
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.2.11394342"
          [ -d "$NDK" ] || NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | head -1)"
          echo "NDK utilisé: $NDK"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          # cc-rs (rusqlite bundled -> sqlite3.c) cherche "aarch64-linux-android-clang",
          # nom legacy absent du NDK moderne : on force le clang API-suffixé.
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --release --target aarch64-linux-android

      - name: Gate — Android lint (Zero critical)
        working-directory: android
        run: ./gradlew lint

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Gate qualité : APK sig vérifiable (cœur crypto) ──────────────
      - name: Release APK (assembleRelease)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: onde-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  #────────────────────────────────────────────────────────────────────────
  # JOB 3 — ui (Tauri + React) : npm ci · build · audit · tauri rust checks
  #────────────────────────────────────────────────────────────────────────
  ui:
    name: UI (vite build · npm audit · tauri rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ui/web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('ui/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install deps
        working-directory: ui/web
        run: npm ci

      - name: Build (vite)
        working-directory: ui/web
        run: npm run build

      # ── Gate qualité ui ──────────────────────────────────────────────
      - name: Gate — npm audit (high+ = fail)
        working-directory: ui/web
        run: npm audit --audit-level=high

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust (tauri src)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Gate — tauri clippy
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Gate — tauri tests
        working-directory: ui/src-tauri
        run: cargo test

  #────────────────────────────────────────────────────────────────────────
  # Quality gate hebdomadaire : conflit de dépendances obsolètes
  #────────────────────────────────────────────────────────────────────────
  quality-scan:
    name: Qualité hebdo (cargo audit · npm audit)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: cargo audit (rust)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit (ui)
        working-directory: ui/web
        run: npm audit --audit-level=high || true   # report non-bloquant hebdo

  #────────────────────────────────────────────────────────────────────────
  # JOB 4 — coverage-gate (T26) : diff-coverage >= 80 % ± 2 pts sur les
  # fichiers .rs modifiés du workspace core/ uniquement.
  # Décision utilisateur 2026-08-23 · spec : reports/t22-coverage/proposition-gate.md
  # Exclusions déclarées : src/bin/*, whisper_cpp_sys (vendored), build.rs,
  # cfg(test) (couvert par construction), #[ignore] non compté couvert.
  # Jamais de faux rouge : aucun .rs modifié mesurable -> PASS explicite ;
  # push sans base de diff fiable -> skip passant.
  #────────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: Gate coverage (diff ≥ 80 % ± 2 pts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0            # historique complet : base de diff résoluble
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-covgate-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-covgate-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Resolve diff base (PR = sha de base · push = commit parent · sinon skip passant)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "DIFF_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "Base de diff (pull_request) : ${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] \
               || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "GATE_SKIP=1" >> "$GITHUB_ENV"
              echo "Aucune base de diff fiable sur ${GITHUB_EVENT_NAME} -> gate SKIP passant."
            else
              echo "DIFF_BASE=${BEFORE}" >> "$GITHUB_ENV"
              echo "Base de diff (${GITHUB_EVENT_NAME}) : ${BEFORE}"
            fi
          fi

      - name: List modified .rs files vs DIFF_BASE
        if: env.GATE_SKIP != '1'
        run: |
          set -euo pipefail
          git diff --diff-filter=d --name-only "$DIFF_BASE" -- '*.rs' > /tmp/modified_rs.txt
          echo ".rs modifiés (suppressions exclues) : $(wc -l < /tmp/modified_rs.txt)"
          cat /tmp/modified_rs.txt

      - name: Generate coverage JSON (cargo llvm-cov)
        if: env.GATE_SKIP != '1'
        working-directory: core
        run: cargo llvm-cov --workspace --locked --json --output-path cov.json

      # Script stdlib-only : agrégat lignes sur fichiers modifiés, exit 1 si < seuil-tolérance.
      - name: Gate — diff coverage ≥ 80 % ± 2 pts (fichiers .rs modifiés uniquement)
        if: env.GATE_SKIP != '1'
        run: |
          set -euo pipefail
          python3 scripts/diff_coverage.py \
            --cov core/cov.json \
            --modified-file /tmp/modified_rs.txt \
            --threshold 80 --tolerance 2 \
            --label "base=${DIFF_BASE}"

      - name: Upload triage artifacts (échec uniquement)
        if: failure() && env.GATE_SKIP != '1'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-gate-triage
          path: |
            core/cov.json
            /tmp/modified_rs.txt
          if-no-files-found: ignore
