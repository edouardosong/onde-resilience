[workspace]
resolver = "2"
members = [
    "dtn-router",
    "llm-inference",
    "crypto-module",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Edouard Song <edouard@onde.network>"]
license = "MIT"
repository = "https://github.com/edouardosong/onde-resilience"
description = "ONDE Resilience Network - Core Rust Implementation"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
sha2 = "0.10"
ring = "0.17"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "mdns"] }
